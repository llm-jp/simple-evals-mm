<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>How a job resumes: the same settings continue it, changed settings are refused, and sem run --from starts a new job that reuses the still-valid trials</title>
  <rect x="0.5" y="0.5" width="959" height="379" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>

  <!-- job line -->
  <text x="40" y="132" font-weight="700" fill="#24292f">job <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">opus55__max</tspan></text>
  <line x1="60" y1="160" x2="900" y2="160" stroke="#57606a" stroke-width="3"/>

  <!-- refused attempts (branches that go nowhere) -->
  <path d="M400,160 C400,110 420,80 450,62" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <g transform="translate(458 56)"><circle r="11" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#cf222e" stroke-width="2.2"/></g>
  <text x="476" y="46" fill="#24292f">resume with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--max-output-tokens 65536</tspan></text>
  <text x="476" y="64" fill="#cf222e">refused: the config differs</text>

  <path d="M640,160 C640,125 655,108 678,98" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <g transform="translate(686 96)"><circle r="11" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#cf222e" stroke-width="2.2"/></g>
  <text x="704" y="92" fill="#24292f">the provider now serves fp8</text>
  <text x="704" y="110" fill="#cf222e">refused: the endpoint differs</text>

  <!-- sessions on the job line -->
  <g transform="translate(110 160)"><circle r="12" fill="#ffffff" stroke="#57606a" stroke-width="3"/></g>
  <text x="110" y="196" text-anchor="middle" font-weight="700" fill="#24292f">sem run</text>
  <text x="110" y="214" text-anchor="middle" fill="#57606a">commit a1b2c3</text>
  <text x="110" y="232" text-anchor="middle" fill="#57606a">300 / 594 trials, stopped</text>

  <g transform="translate(320 160)"><circle r="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><path d="M-5,0 L-1.5,4 L5,-4" fill="none" stroke="#1a7f37" stroke-width="2.4"/></g>
  <text x="320" y="196" text-anchor="middle" font-weight="700" fill="#24292f">resume</text>
  <text x="320" y="214" text-anchor="middle" fill="#57606a">same commit, config, data, endpoint</text>
  <text x="320" y="232" text-anchor="middle" fill="#57606a">runs only the missing trials</text>

  <g transform="translate(560 160)"><circle r="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><path d="M-5,0 L-1.5,4 L5,-4" fill="none" stroke="#1a7f37" stroke-width="2.4"/></g>
  <text x="560" y="196" text-anchor="middle" font-weight="700" fill="#24292f">resume at commit d4e5f6</text>
  <text x="560" y="214" text-anchor="middle" fill="#57606a">the change cannot affect this job</text>
  <text x="560" y="232" text-anchor="middle" fill="#57606a">(docs, another dataset): accepted</text>

  <g transform="translate(830 160)"><circle r="12" fill="#57606a"/></g>
  <text x="830" y="196" text-anchor="middle" font-weight="700" fill="#24292f">594 / 594</text>
  <text x="830" y="214" text-anchor="middle" fill="#57606a">verified; scores computed</text>
  <text x="830" y="232" text-anchor="middle" fill="#57606a">from the trials</text>

  <!-- a new job derived with sem run (from) -->
  <path d="M705,160 L705,300" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="705" y1="316" x2="900" y2="316" stroke="#0969da" stroke-width="3"/>
  <g transform="translate(705 316)"><circle r="12" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/></g>
  <text x="40" y="282" font-weight="700" fill="#24292f">commit e7f8a9 changes the GPQA prompt</text>
  <text x="40" y="300" fill="#cf222e">resume refused: the stored GPQA trials would change</text>
  <text x="40" y="320" fill="#57606a"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">sem run --from opus55__max</tspan> starts a new job:</text>
  <text x="40" y="338" fill="#57606a">copies the other datasets' trials, reruns only GPQA</text>
  <text x="725" y="302" fill="#24292f" font-weight="700">job <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">opus55__max__v2</tspan></text>
  <text x="725" y="340" fill="#57606a">own config and lock, at e7f8a9</text>
</svg>
