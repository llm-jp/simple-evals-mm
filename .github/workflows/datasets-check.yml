# Weekly check of the pinned dataset revisions and the locked unversioned source files (datasets.lock) against
# upstream (`sem datasets check`), and of the small ungated text datasets against datasets.lock
# (`sem datasets lock --check`): when something is outdated or differs, open (or update) the issue labelled
# `dataset-update`. Needs no secrets beyond GITHUB_TOKEN; a gated Hugging Face
# repository whose metadata needs HF_TOKEN is reported as "skipped" instead of failing the check.
name: Dataset revisions check

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - id: check
        run: |
          set +e
          uv run --frozen sem datasets check > report.txt
          rc=$?
          echo "--- sem datasets lock --check (small text datasets)" >> report.txt
          uv run --frozen sem datasets lock --check -d gpqa,mmlu,math,simpleqa,aime26,ifeval,ifbench,humaneval >> report.txt 2>&1
          lrc=$?
          if [ "$lrc" != 0 ] && [ "$rc" != 1 ]; then rc=1; fi
          cat report.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Open or update the dataset-update issue
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dataset-update --color FBCA04 --description "A pinned dataset revision is behind upstream" 2>/dev/null || true
          {
            echo "\`sem datasets check\` found pinned dataset revisions behind upstream ($(date -u +%F), run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Review the upstream change, then bump the pin in the dataset code (a new revision changes task ids / results) or add it to dataset_admin.HELD with the reason; for a changed source file or task digest, review it and run \`sem datasets lock -d <dataset>\`."
          } > body.md
          n=$(gh issue list --label dataset-update --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file body.md
          else
            gh issue create --title "Dataset revisions behind upstream" --label dataset-update --body-file body.md
          fi
      - name: Fail on lookup errors
        if: steps.check.outputs.rc != '0' && steps.check.outputs.rc != '1'
        run: exit 1
