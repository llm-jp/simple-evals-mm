<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>A job resumes only when nothing that affects its results has changed; otherwise sem run (from) starts a new job. sem job parity compares the scores with the model card. (Portrait layout for narrow screens.)</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="359" height="719" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1. resume: a vertical timeline, the text beside each step -->
  <text x="20" y="32" font-size="12" font-weight="700" fill="#57606a" letter-spacing="0.06em">1 · RESUME</text>
  <text x="20" y="58" font-weight="700" fill="#24292f">job <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">qwen38-27b__xhigh</tspan></text>

  <line x1="38" y1="88" x2="38" y2="150" stroke="#57606a" stroke-width="3"/>
  <line x1="38" y1="150" x2="38" y2="214" stroke="#57606a" stroke-width="3" stroke-dasharray="3 6"/>
  <line x1="38" y1="214" x2="38" y2="290" stroke="#57606a" stroke-width="3"/>
  <line x1="38" y1="290" x2="38" y2="356" stroke="#57606a" stroke-width="3" stroke-dasharray="3 6"/>

  <circle cx="38" cy="88" r="11" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <text x="62" y="93" font-weight="700" fill="#24292f">sem run</text>

  <g transform="translate(38 150)"><circle r="13" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/><path d="M2,-8 L-4.5,1 L0,1 L-2,8 L4.5,-1 L0,-1 Z" fill="#bf8700"/></g>
  <text x="62" y="146" font-weight="700" fill="#9a6700">stopped at 300 / 594</text>
  <text x="62" y="164" fill="#57606a">the node's walltime ran out</text>

  <g transform="translate(38 214)"><circle r="11" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><path d="M-5,0 L-1.5,4 L5,-4" fill="none" stroke="#1a7f37" stroke-width="2.4"/></g>
  <text x="62" y="210" font-weight="700" fill="#24292f">sem job resume</text>
  <text x="62" y="228" fill="#57606a">nothing changed: runs only</text>
  <text x="62" y="245" fill="#57606a">the missing trials</text>

  <circle cx="38" cy="290" r="11" fill="#57606a"/>
  <text x="62" y="286" font-weight="700" fill="#24292f">594 / 594</text>
  <text x="62" y="304" fill="#57606a">verified</text>

  <g transform="translate(38 356)"><circle r="11" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#cf222e" stroke-width="2.2"/></g>
  <text x="62" y="352" font-weight="700" fill="#24292f">resume after a change <tspan fill="#cf222e" font-weight="400">refused</tspan></text>
  <text x="62" y="370" fill="#57606a">to the code it uses, the data,</text>
  <text x="62" y="387" fill="#57606a">the settings or the endpoint</text>

  <path d="M38,368 L38,436" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="62" y="416" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">sem run --from</text>
  <circle cx="38" cy="450" r="11" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
  <text x="62" y="446" font-weight="700" fill="#24292f">a new job</text>
  <text x="62" y="464" fill="#57606a">copies the still-valid trials,</text>
  <text x="62" y="481" fill="#57606a">reruns the rest</text>

  <!-- 2. parity: the two scores side by side, both into sem job parity -->
  <line x1="20" y1="506" x2="340" y2="506" stroke="#d0d7de"/>
  <text x="20" y="534" font-size="12" font-weight="700" fill="#57606a" letter-spacing="0.06em">2 · PARITY</text>

  <rect x="20" y="548" width="152" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M32,558 h11 l5,5 v15 h-16 z" fill="#ffffff" stroke="#57606a" stroke-width="1.4"/>
  <text x="56" y="574" font-weight="700" fill="#24292f">model card</text>
  <text x="32" y="598" font-size="13" fill="#57606a">GPQA Diamond</text><text x="160" y="598" text-anchor="end" fill="#24292f">89.2</text>

  <rect x="188" y="548" width="152" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="200" y="574" font-weight="700" fill="#24292f">this job's score</text>
  <text x="200" y="598" font-size="13" fill="#57606a">GPQA Diamond</text><text x="328" y="598" text-anchor="end" fill="#24292f">90.4</text>

  <path d="M96,610 L150,632" stroke="#57606a" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M264,610 L210,632" stroke="#57606a" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="96" y="634" width="168" height="44" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="180" y="652" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#24292f">sem job parity</text>
  <g transform="translate(140 667)"><circle r="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><path d="M-3.5,0 L-1,3 L3.5,-3" fill="none" stroke="#1a7f37" stroke-width="2"/></g>
  <text x="154" y="672" font-size="13" fill="#24292f">+1.2 within</text>

  <text x="180" y="702" text-anchor="middle" font-size="12.5" fill="#57606a">A gap outside the tolerance is looked into.</text>
</svg>
