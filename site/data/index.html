<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to Explore · simple-evals-mm</title>
<link rel="canonical" href="../explore/?view=benchmarks">
<script>
  // the dataset descriptions are now Explore's Datasets tab; a category filter or a #task-<key> anchor carries over
  const q = new URLSearchParams(location.search), m = location.hash.match(/^#task-(.+)$/);
  const p = new URLSearchParams(m ? {view: "tasks", d: m[1]} : {view: "benchmarks", ...(q.get("category") ? {category: q.get("category")} : {})});
  location.replace("../explore/?" + p);
</script>
<meta http-equiv="refresh" content="0; url=../explore/?view=benchmarks">
</head>
<body><p>The dataset list moved to <a href="../explore/?view=benchmarks">Explore</a>.</p></body>
</html>
