<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script>
  // The docs are the Markdown files of the repository (docs/, README, CONTRIBUTING) at a version (a tag, or main),
  // fetched from GitHub and rendered here: nothing is built or copied, so the site never holds a stale copy.
  const REPO = "llm-jp/simple-evals-mm";
  const RAW = (ref, path) => `https://raw.githubusercontent.com/${REPO}/${ref}/${path}`;
  const BLOB = (ref, path) => `https://github.com/${REPO}/blob/${ref}/${path}`;
  const FIRST_VERSION = [0, 6, 0];  // the first release with these docs
  const PAGES = [
    ["Start", [["docs/README.md", "Overview"], ["docs/getting-started.md", "Getting started"], ["docs/concepts.md", "Concepts"]]],
    ["Guides", [["docs/guides/api-models.md", "API models"], ["docs/guides/local-models.md", "Local models (vLLM / SGLang)"],
                ["docs/guides/sharing.md", "Sharing and merging"], ["docs/guides/analysis.md", "Analysis"],
                ["CONTRIBUTING.md", "Adding a benchmark or model"]]],
    ["Reference", [["docs/cli.md", "Commands"], ["docs/task_setup.md", "Dataset setup"], ["docs/versioning.md", "Versioning"],
                   ["docs/cost.md", "Time and cost"], ["docs/parity.md", "Parity with model cards"]]],
  ];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  // GitHub's heading anchors: lower case, punctuation dropped, spaces to hyphens
  const slug = s => s.toLowerCase().trim().replace(/<[^>]+>/g, "").replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
  const params = () => new URLSearchParams(location.search);
  let DEFAULT_REF = "main";  // the newest release tag with these docs once there is one (versions())
  const state = () => ({ ref: params().get("v") || DEFAULT_REF, page: params().get("p") || "docs/README.md" });

  function resolve(base, rel) {  // a repository path relative to the page's directory
    const parts = base.split("/").slice(0, -1);
    for (const seg of rel.split("/")) {
      if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
    }
    return parts.join("/");
  }
  const href = (ref, page) => `?${new URLSearchParams({ ...(ref !== DEFAULT_REF ? { v: ref } : {}), p: page })}`;

  function toc(ref, page) {
    document.getElementById("docs-toc").innerHTML = PAGES.map(([group, items]) =>
      `<div class="docs-group">${esc(group)}</div>` + items.map(([p, label]) =>
        `<a href="${href(ref, p)}"${p === page ? ' aria-current="page"' : ""}>${esc(label)}</a>`).join("")).join("");
  }

  async function versions() {
    const sel = document.getElementById("docs-ver");
    let tags = [];
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/tags?per_page=100`);
      if (r.ok) tags = (await r.json()).map(t => t.name);
    } catch (e) { /* offline or rate-limited: main only */ }
    const num = t => (t.match(/^v(\d+)\.(\d+)\.(\d+)$/) || []).slice(1).map(Number);
    const newer = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
    tags = tags.filter(t => num(t).length === 3 && newer(num(t), FIRST_VERSION) >= 0).sort((a, b) => newer(num(b), num(a)));
    if (tags.length) DEFAULT_REF = tags[0];
    const ref = state().ref;
    const opts = [...tags, "main"];
    if (!opts.includes(ref)) opts.push(ref);
    sel.innerHTML = opts.map(v => `<option value="${esc(v)}"${v === ref ? " selected" : ""}>${v === "main" ? "main (unreleased)" : esc(v) + (v === tags[0] ? " (latest)" : "")}</option>`).join("");
    sel.onchange = () => { location.search = href(sel.value, state().page).slice(1); };
  }

  async function render() {
    const { ref, page } = state();
    toc(ref, page);
    const body = document.getElementById("docs-body");
    let md;
    try {
      const r = await fetch(RAW(ref, page));
      if (!r.ok) throw new Error(`${r.status}`);
      md = await r.text();
    } catch (e) {
      body.innerHTML = `<p class="docs-status">${esc(page)} is not in ${esc(ref)} (${esc(e.message)}). <a href="${href("main", "docs/README.md")}">Open the latest docs</a>.</p>`;
      return;
    }
    body.innerHTML = marked.parse(md, { gfm: true });
    for (const h of body.querySelectorAll("h1, h2, h3, h4")) h.id = slug(h.textContent);
    for (const a of body.querySelectorAll("a[href]")) {  // repository links: Markdown pages here, other files on GitHub
      const raw = a.getAttribute("href");
      if (/^(https?:|mailto:|#)/.test(raw)) { if (/^https?:/.test(raw)) { a.target = "_blank"; a.rel = "noopener"; } continue; }
      const [path, anchor] = raw.split("#");
      const target = resolve(page, path);
      a.href = target.endsWith(".md") ? href(ref, target) + (anchor ? `#${anchor}` : "") : BLOB(ref, target);
    }
    for (const img of body.querySelectorAll("img[src]")) {
      const src = img.getAttribute("src");
      if (!/^(https?:|data:)/.test(src)) img.src = RAW(ref, resolve(page, src));
    }
    const diagrams = body.querySelectorAll("code.language-mermaid");
    if (diagrams.length) {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
      const dark = document.documentElement.dataset.theme === "dark"
        || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });
      for (const code of diagrams) {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        code.parentElement.replaceWith(div);
      }
      await mermaid.run({ querySelector: ".docs-body .mermaid" });
    }
    const title = body.querySelector("h1");
    document.title = `${title ? title.textContent : "Docs"} · simple-evals-mm`;
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  }

  versions().then(render);
</script>
