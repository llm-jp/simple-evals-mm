<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.2/dist/umd/index.min.js"></script>
<script>
  // The docs are the Markdown files of the repository (docs/, README, CONTRIBUTING) at a version (a tag from
  // v0.7.0, or main), fetched from GitHub and rendered here: nothing is built or copied, so there is no stale copy.
  const REPO = "llm-jp/simple-evals-mm";
  const RAW = (ref, path) => `https://raw.githubusercontent.com/${REPO}/${ref}/${path}`;
  const BLOB = (ref, path) => `https://github.com/${REPO}/blob/${ref}/${path}`;
  const FIRST_VERSION = [0, 7, 0];  // the first release with these docs (keep DEFAULT_REF below at least this)
  // the sidebar: the "## Contents" list of docs/README.md at the version (navFrom); LEGACY_PAGES for v0.6.0, whose
  // README has none
  let PAGES = [];
  const LEGACY_PAGES = [
    ["Start", [["docs/README.md", "Overview"], ["docs/getting-started.md", "Getting started"], ["docs/concepts.md", "Concepts"]]],
    ["Guides", [["docs/guides/api-models.md", "API models"], ["docs/guides/local-models.md", "Local models (vLLM / SGLang)"],
                ["docs/guides/sharing.md", "Sharing and merging"], ["docs/guides/analysis.md", "Analysis"],
                ["CONTRIBUTING.md", "Adding a benchmark or model"]]],
    ["Reference", [["docs/cli.md", "Commands"], ["docs/configuration.md", "Configuration"], ["docs/task_setup.md", "Dataset setup"],
                   ["docs/troubleshooting.md", "Troubleshooting"], ["docs/versioning.md", "Versioning"],
                   ["docs/cost.md", "Time and cost"], ["docs/parity.md", "Parity with model cards"]]],
  ];
  let FLAT = [];
  function navFrom(md) {  // [[group, [[path, label], ...]], ...] from "- **Group**" / "  - [Label](path)" lines
    const sec = (md.split(/^## Contents\s*$/m)[1] || "").split(/^## /m)[0];
    const groups = [];
    for (const line of sec.split("\n")) {
      let m = line.match(/^- \*\*(.+?)\*\*\s*$/);
      if (m) { groups.push([m[1], []]); continue; }
      m = line.match(/^\s+- \[(.+?)\]\(([^)#\s]+\.md)\)/);
      if (m && groups.length) groups[groups.length - 1][1].push([resolve("docs/README.md", m[2]), m[1]]);
    }
    return groups.filter(g => g[1].length);
  }
  async function loadNav(ref) {
    const key = `sem-docs-nav:${ref}`;
    let nav = null;
    try { nav = JSON.parse(sessionStorage.getItem(key) || "null"); } catch (e) {}
    if (!nav) {
      try {
        const r = await fetch(RAW(ref, "docs/README.md"));
        if (r.ok) nav = navFrom(await r.text());
      } catch (e) {}
      if (nav && nav.length) try { sessionStorage.setItem(key, JSON.stringify(nav)); } catch (e) {}
    }
    PAGES = nav && nav.length ? nav : LEGACY_PAGES;
    FLAT = PAGES.flatMap(([group, items]) => items.map(([p, label]) => ({ p, label, group })));
  }
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  // GitHub's heading anchors: lower case, punctuation dropped, spaces to hyphens
  const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
  const params = () => new URLSearchParams(location.search);
  // the newest release tag (versions(): the GitHub tag list); FIRST_VERSION when the list cannot be read (rate limit)
  let DEFAULT_REF = "v0.7.0";
  const num = t => (String(t).match(/^v(\d+)\.(\d+)\.(\d+)$/) || []).slice(1).map(Number);
  const newer = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
  // only main and the release tags from FIRST_VERSION have these docs: another ref (an older tag, a branch) is
  // replaced by the default and said so
  const allowed = ref => ref === "main" || (num(ref).length === 3 && newer(num(ref), FIRST_VERSION) >= 0);
  const state = () => {
    const asked = params().get("v");
    return { ref: asked && allowed(asked) ? asked : DEFAULT_REF, asked, page: params().get("p") || "docs/README.md" };
  };
  function resolve(base, rel) {  // a repository path relative to the page's directory
    const parts = base.split("/").slice(0, -1);
    for (const seg of rel.split("/")) {
      if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
    }
    return parts.join("/");
  }
  const href = (ref, page) => `?${new URLSearchParams({ ...(ref !== DEFAULT_REF ? { v: ref } : {}), p: page })}`;

  async function copy(text, btn, label) {
    try { await navigator.clipboard.writeText(text); } catch (e) { return; }
    const old = btn.innerHTML;
    btn.innerHTML = ICON_DONE + (label ? `<span>${label}</span>` : "");
    btn.classList.add("done");
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove("done"); }, 1400);
  }

  function sidebar(ref, page) {
    document.getElementById("docs-toc").innerHTML = PAGES.map(([group, items]) =>
      `<div class="docs-group">${esc(group)}</div>` + items.map(([p, label]) =>
        `<a href="${href(ref, p)}"${p === page ? ' aria-current="page"' : ""}>${esc(label)}</a>`).join("")).join("");
    const cur = FLAT.find(x => x.p === page);
    document.getElementById("docs-menu-label").textContent = cur ? `${cur.group} · ${cur.label}` : "Contents";
    if (matchMedia("(max-width: 760px)").matches) document.getElementById("docs-menu").open = false;
  }

  async function versions() {
    const sel = document.getElementById("docs-ver");
    let tags = [];
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/tags?per_page=100`);
      if (r.ok) tags = (await r.json()).map(t => t.name);
    } catch (e) { /* offline or rate-limited: main and the asked tag only */ }
    tags = tags.filter(t => allowed(t) && t !== "main").sort((a, b) => newer(num(b), num(a)));
    if (!tags.length) tags = [DEFAULT_REF];
    DEFAULT_REF = tags[0];
    const ref = state().ref;
    const opts = [...tags, "main"];
    if (!opts.includes(ref)) opts.unshift(ref);  // an allowed tag the tag list did not return (rate limit)
    sel.innerHTML = opts.map(v => `<option value="${esc(v)}"${v === ref ? " selected" : ""}>${v === "main" ? "main (unreleased)" : esc(v) + (v === tags[0] ? " (latest)" : "")}</option>`).join("");
    sel.onchange = () => { location.search = href(sel.value, state().page).slice(1); };
  }

  function decorate(body, ref, page) {
    // headings: ids as on GitHub (deduplicated), a hover link
    const seen = {};
    for (const h of body.querySelectorAll("h1, h2, h3, h4")) {
      let id = slug(h.textContent);
      if (seen[id] !== undefined) id = `${id}-${++seen[id]}`; else seen[id] = 0;
      h.id = id;
      if (h.tagName !== "H1") h.insertAdjacentHTML("beforeend", ` <a class="docs-anchor" href="#${id}" aria-label="Link to this section">#</a>`);
    }
    // repository links: Markdown pages stay here, other files open on GitHub
    for (const a of body.querySelectorAll("a[href]")) {
      const raw = a.getAttribute("href");
      if (a.classList.contains("docs-anchor") || raw.startsWith("#")) continue;
      if (/^(https?:|mailto:)/.test(raw)) { a.target = "_blank"; a.rel = "noopener"; continue; }
      const [path, anchor] = raw.split("#");
      const target = resolve(page, path);
      a.href = target.endsWith(".md") ? href(ref, target) + (anchor ? `#${anchor}` : "") : BLOB(ref, target);
    }
    for (const img of body.querySelectorAll("img[src]")) {
      const src = img.getAttribute("src");
      if (!/^(https?:|data:)/.test(src)) img.src = RAW(ref, resolve(page, src));
    }
    // code: highlighting and a copy button (the text as written: comments are harmless in a shell)
    for (const code of body.querySelectorAll("pre > code")) {
      const lang = (code.className.match(/language-(\w+)/) || [])[1];
      if (lang === "mermaid") continue;
      const text = code.textContent;
      if (window.hljs) {
        if (lang && hljs.getLanguage(lang)) hljs.highlightElement(code);
        else code.classList.add("hljs");
      }
      const pre = code.parentElement;
      const wrap = document.createElement("div");
      wrap.className = "docs-code";
      pre.replaceWith(wrap);
      wrap.appendChild(pre);
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "docs-copy"; btn.title = "Copy"; btn.setAttribute("aria-label", "Copy code");
      btn.innerHTML = ICON_COPY;
      btn.onclick = () => copy(text.replace(/\n$/, ""), btn);
      wrap.appendChild(btn);
    }
    for (const t of body.querySelectorAll("table")) {  // wide tables scroll inside their box
      const w = document.createElement("div");
      w.className = "docs-table";
      t.replaceWith(w);
      w.appendChild(t);
    }
  }

  function onThisPage(body) {
    const hs = [...body.querySelectorAll("h2, h3")];
    const otp = document.getElementById("docs-otp");
    otp.parentElement.hidden = hs.length < 2;
    otp.innerHTML = hs.map(h => `<a href="#${h.id}" class="lvl-${h.tagName[1]}">${esc(h.textContent.replace(/\s*#$/, ""))}</a>`).join("");
    const links = [...otp.querySelectorAll("a")];
    const spy = () => {  // the last heading above the top third of the window
      let cur = 0;
      hs.forEach((h, i) => { if (h.getBoundingClientRect().top < innerHeight / 3) cur = i; });
      links.forEach((a, i) => a.classList.toggle("active", i === cur));
    };
    window.onscroll = spy;
    spy();
  }

  function pager(ref, page) {
    const i = FLAT.findIndex(x => x.p === page);
    const prev = i > 0 ? FLAT[i - 1] : null, next = i >= 0 && i < FLAT.length - 1 ? FLAT[i + 1] : null;
    const card = (x, dir) => x ? `<a class="docs-pg ${dir}" href="${href(ref, x.p)}"><span>${dir === "prev" ? "Previous" : "Next"}</span><b>${esc(x.label)}</b></a>` : "<span></span>";
    document.getElementById("docs-pager").innerHTML = card(prev, "prev") + card(next, "next");
  }

  async function render() {
    const { ref, asked, page } = state();
    await loadNav(ref);
    sidebar(ref, page);
    const cur = FLAT.find(x => x.p === page);
    document.getElementById("docs-crumb").textContent = cur ? cur.group : "";
    document.getElementById("view-md").href = BLOB(ref, page);
    document.getElementById("docs-foot").innerHTML =
      `<a href="https://github.com/${REPO}/edit/main/${esc(page)}" target="_blank" rel="noopener">Suggest an edit</a>` +
      `<a href="https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Docs: " + page)}" target="_blank" rel="noopener">Raise an issue</a>`;
    pager(ref, page);
    const body = document.getElementById("docs-body");
    const note = asked && asked !== ref
      ? `<p class="docs-status">Docs exist from v${FIRST_VERSION.join(".")} on; “${esc(asked)}” is shown as ${esc(ref)}.</p>` : "";
    let md;
    try {
      const r = await fetch(RAW(ref, page));
      if (!r.ok) throw new Error(`${r.status}`);
      md = await r.text();
    } catch (e) {
      body.innerHTML = note + `<p class="docs-status">${esc(page)} is not in ${esc(ref)} (${esc(e.message)}). <a href="${href(DEFAULT_REF, "docs/README.md")}">Open the docs of ${esc(DEFAULT_REF)}</a>.</p>`;
      return;
    }
    document.getElementById("copy-page").onclick = e => copy(md, e.currentTarget, "Copied");
    body.innerHTML = note + marked.parse(md, { gfm: true });
    decorate(body, ref, page);
    const diagrams = body.querySelectorAll("code.language-mermaid");
    if (diagrams.length) {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
      const dark = document.documentElement.dataset.theme === "dark"
        || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });
      for (const code of diagrams) {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        code.parentElement.replaceWith(div);
      }
      await mermaid.run({ querySelector: ".docs-body .mermaid" });
    }
    onThisPage(body);
    const title = body.querySelector("h1");
    document.title = `${title ? title.textContent : "Docs"} · simple-evals-mm`;
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  }

  // ---- search: MiniSearch over the sections (## / ###) of every page in the sidebar, at the selected version; the
  // pages are fetched the first time the box is used (about 30 small files) and indexed in the browser
  let INDEX = null, INDEXING = null;
  function sections(page, md) {
    const title = (md.match(/^# (.+)$/m) || [, page])[1].trim();
    const out = [];
    let head = "", id = "", buf = [], fence = false, skip = false;
    const flush = () => {
      const text = buf.join(" ").replace(/`{1,3}|\*\*|__|\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/\s+/g, " ").trim();
      if (text || head) out.push({ id: `${page}#${id}`, page, anchor: id, title, heading: head, text });
      buf = [];
    };
    for (const line of md.split("\n")) {
      if (/^```/.test(line)) { fence = !fence; skip = fence && /^```mermaid/.test(line); continue; }
      if (fence && skip) continue;  // diagrams are not text
      const m = !fence && line.match(/^(#{1,3}) (.+)$/);
      if (m) { flush(); head = m[1] === "#" ? "" : m[2].trim(); id = head ? slug(head) : ""; continue; }
      buf.push(line.replace(/<[^>]+>/g, " ").replace(/^\s*\|?[-:| ]+\|?\s*$/, "").replace(/\|/g, " "));
    }
    flush();
    return out;
  }
  async function buildIndex() {
    const ref = state().ref;
    if (!FLAT.length) await loadNav(ref);
    const docs = (await Promise.all(FLAT.map(async x => {
      try { const r = await fetch(RAW(ref, x.p)); return r.ok ? sections(x.p, await r.text()) : []; } catch (e) { return []; }
    }))).flat();
    const ms = new MiniSearch({ fields: ["title", "heading", "text"], storeFields: ["page", "anchor", "title", "heading", "text"],
                                searchOptions: { boost: { title: 3, heading: 2 }, prefix: true, fuzzy: 0.15, combineWith: "AND" } });
    ms.addAll(docs);
    return ms;
  }
  function snippet(text, q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const low = text.toLowerCase();
    const at = Math.max(0, Math.min(...words.map(w => { const i = low.indexOf(w); return i < 0 ? Infinity : i; })) - 40);
    let s = (at > 0 ? "…" : "") + text.slice(Number.isFinite(at) ? at : 0, (Number.isFinite(at) ? at : 0) + 150);
    s = esc(s);
    for (const w of words) if (w.length > 1) s = s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
    return s + "…";
  }
  async function search(q) {
    const hits = document.getElementById("docs-hits");
    if (!q.trim()) { hits.hidden = true; return; }
    if (!INDEX) {
      place(hits); hits.hidden = false; hits.innerHTML = '<div class="docs-hit-none">Indexing…</div>';
      INDEX = await (INDEXING ||= buildIndex());
    }
    const ref = state().ref;
    const res = INDEX.search(q).slice(0, 8);
    place(hits);
    hits.hidden = false;
    hits.innerHTML = res.length ? res.map((r, i) => `<a class="docs-hit${i === 0 ? " sel" : ""}" href="${href(ref, r.page)}${r.anchor ? "#" + r.anchor : ""}">
        <b>${esc(r.title)}${r.heading ? ` <span>› ${esc(r.heading)}</span>` : ""}</b><small>${snippet(r.text, q)}</small></a>`).join("")
      : '<div class="docs-hit-none">No results</div>';
  }
  function place(hits) {  // fixed under the box (the sidebar scrolls and is narrower than the results)
    const r = document.getElementById("docs-q").getBoundingClientRect();
    hits.style.left = `${Math.max(8, Math.min(r.left, innerWidth - Math.min(560, innerWidth - 16) - 8))}px`;
    hits.style.top = `${r.bottom + 6}px`;
  }
  window.addEventListener("resize", () => { const h = document.getElementById("docs-hits"); if (!h.hidden) place(h); });
  window.addEventListener("scroll", () => { const h = document.getElementById("docs-hits"); if (!h.hidden) place(h); }, { passive: true });
  const q = document.getElementById("docs-q");
  q.addEventListener("input", () => search(q.value));
  q.addEventListener("focus", () => { if (!INDEXING) INDEXING = buildIndex(); if (q.value) search(q.value); });
  q.addEventListener("keydown", e => {
    const items = [...document.querySelectorAll("#docs-hits .docs-hit")];
    const i = items.findIndex(a => a.classList.contains("sel"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!items.length) return;
      const j = (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((a, k) => a.classList.toggle("sel", k === j));
      items[j].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter" && items.length) { e.preventDefault(); location.href = items[Math.max(i, 0)].href; }
    else if (e.key === "Escape") { q.value = ""; search(""); q.blur(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  document.addEventListener("click", e => { if (!e.target.closest(".docs-search")) document.getElementById("docs-hits").hidden = true; });
  window.addEventListener("hashchange", () => {  // a result on the same page: scroll to it
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView();
    document.getElementById("docs-hits").hidden = true;
  });

  versions().then(render);
</script>
<script src="../theme.js"></script>
</body>
</html>
