[project]
name = "simple-evals-mm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "speed1313", email = "speedtry13@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.5.0",
    "google-genai>=1.64.0",
    "numpy>=2.4.2",
    "openai>=2.21.0",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.1",
    "matplotlib>=3.10.0",
    "torch==2.8.0",
    "transformers==4.57.0",
    "flask>=3.1.0",
    "torchvision>=0.23.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_evals_mm"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (HuggingFace downloads)",
    "local_data: tests that require local data files",
    "api: tests that require API keys (OpenAI, Gemini, etc.)",
    "local_model: tests that require GPU and local HF models",
]
